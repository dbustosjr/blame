name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (TRD C-7, ARCHITECTURE section 12). The comment names the tag.
jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm lint
      - name: No em or en dashes in Markdown
        run: pnpm check:dashes
      - name: Import boundary (only packages/core imports Pi)
        run: pnpm check:boundary
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  extension:
    name: Extension tests (VS Code, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter blame test
      - name: Integration tests in VS Code
        run: xvfb-run -a pnpm --filter blame test:e2e

  impeccable:
    name: Impeccable design check (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Live Apply can launch other agents with approvals bypassed. Keep it off (AGENTS.md).
      IMPECCABLE_LIVE_COPY_AGENT: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Exit 0 is clean, 2 is findings, 1 is a scan failure. Neither 1 nor 2 is suppressed.
      # Ignores live in .impeccable/config.json (Inter is the brand font).
      - name: Detect
        run: npx --yes impeccable@4.9.1 detect --github apps/web
